{
  "jobs": {
    "build": {
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Build pyre",
          "run": "nix build --show-trace"
        },
        {
          "name": "Run tests",
          "run": "nix develop -c cargo test -- --include-ignored"
        },
        {
          "name": "Build dire",
          "run": "nix build --show-trace .#dire"
        },
        {
          "name": "Push to Cachix",
          "run": "nix build --print-out-paths --no-link | cachix push qntx"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-latest"
          ]
        }
      }
    },
    "build-macos": {
      "if": "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Build pyre",
          "run": "nix build --show-trace"
        },
        {
          "name": "Run tests",
          "run": "nix develop -c cargo test -- --include-ignored"
        },
        {
          "name": "Build dire",
          "run": "nix build --show-trace .#dire"
        },
        {
          "name": "Push to Cachix",
          "run": "nix build --print-out-paths --no-link | cachix push qntx"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "macos-latest"
          ]
        }
      }
    },
    "clippy": {
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Run clippy",
          "run": "nix build --show-trace .#checks.x86_64-linux.clippy"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-latest"
          ]
        }
      }
    },
    "clippy-macos": {
      "if": "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Run clippy",
          "run": "nix build --show-trace .#checks.aarch64-darwin.clippy"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "macos-latest"
          ]
        }
      }
    }
  },
  "name": "Nix",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "schedule": [
      {
        "cron": "0 6 * * 1"
      }
    ],
    "workflow_dispatch": {}
  }
}
